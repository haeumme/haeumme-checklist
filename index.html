<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A neat weekly checklist to plan your week and check things off." />
  <title>My Weekly Checklist</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>" />
</head>
<body>
  <div class="signin" id="signin">
    <div class="signin__card">

      <!-- LOG IN -->
      <div class="view" id="viewLogin">
        <h2 class="signin__title">Welcome back 👋</h2>
        <p class="signin__text">Log in to open your checklist.</p>
        <input class="signin__input" id="loginUser" type="text" placeholder="Username" autocomplete="off" />
        <input class="signin__input" id="loginPass" type="password" placeholder="Password" autocomplete="off" />
        <button class="signin__btn" id="loginBtn" type="button">Log in</button>
        <p class="signin__hint" id="loginHint"></p>
        <div class="signin__links">
          <button class="signin__link" id="toForgot" type="button">Forgot password?</button>
          <button class="signin__link" id="toSignup" type="button">Create account</button>
        </div>
      </div>

      <!-- CREATE ACCOUNT -->
      <div class="view" id="viewSignup" hidden>
        <h2 class="signin__title">Create account ✨</h2>
        <p class="signin__text">Make your own private checklist.</p>
        <input class="signin__input" id="suName" type="text" placeholder="Your name" autocomplete="off" />
        <input class="signin__input" id="suUser" type="text" placeholder="Username" autocomplete="off" />
        <input class="signin__input" id="suPass" type="password" placeholder="Password" autocomplete="off" />
        <input class="signin__input" id="suPass2" type="password" placeholder="Confirm password" autocomplete="off" />
        <input class="signin__input" id="suBackup" type="text" placeholder="Backup answer (if you forget)" autocomplete="off" />
        <button class="signin__btn" id="signupBtn" type="button">Create account</button>
        <p class="signin__hint" id="signupHint"></p>
        <div class="signin__links signin__links--center">
          <button class="signin__link" id="toLoginFromSignup" type="button">← Back to log in</button>
        </div>
      </div>

      <!-- FORGOT PASSWORD -->
      <div class="view" id="viewForgot" hidden>
        <h2 class="signin__title">Reset password 🔑</h2>
        <p class="signin__text">Enter your username and backup answer to set a new password.</p>
        <input class="signin__input" id="fgUser" type="text" placeholder="Username" autocomplete="off" />
        <input class="signin__input" id="fgBackup" type="text" placeholder="Backup answer" autocomplete="off" />
        <input class="signin__input" id="fgPass" type="password" placeholder="New password" autocomplete="off" />
        <input class="signin__input" id="fgPass2" type="password" placeholder="Confirm new password" autocomplete="off" />
        <button class="signin__btn" id="forgotResetBtn" type="button">Reset password</button>
        <p class="signin__hint" id="forgotHint"></p>
        <div class="signin__links signin__links--center">
          <button class="signin__link" id="toLoginFromForgot" type="button">← Back to log in</button>
        </div>
      </div>

    </div>
  </div>

  <main class="app" id="app" hidden>
    <header class="app__header">
      <h1 class="app__title">My Weekly Checklist</h1>
      <p class="app__who" id="who"></p>
      <div class="progress">
        <div class="progress__bar"><span id="progressFill" class="progress__fill"></span></div>
        <p class="progress__label" id="progressLabel">0 of 0 done</p>
      </div>
      <div class="actions">
        <input class="actions__email" id="recipient" type="email" placeholder="Send to (email address)" autocomplete="email" />
        <button class="actions__send" id="sendBtn" type="button">📧 Email my progress</button>
        <button class="reset" id="resetBtn" type="button">Clear all</button>
        <button class="reset" id="signoutBtn" type="button">Sign out</button>
      </div>
    </header>

    <section class="board" id="board" aria-label="Weekly days"></section>

    <footer class="app__footer">
      <p>Haeumme's Checklist</p>
    </footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
